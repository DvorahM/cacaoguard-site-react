<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password | CacaoGuard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login flip">
  <div class="login-photo"><img src="images/forgot-photo.jpg" alt="Terraced cacao hills"></div>
  <main class="login-side"><section class="panel"><h1>Reset Password</h1><p class="sub">Enter your email and we will send you a reset link.</p>
<form id="form"><div class="field"><label for="e" style="display:block;margin-bottom:7px">EMAIL ADDRESS</label><div class="input"><input id="e" type="email" placeholder="juan@cacaoguard.com" required></div></div>
<button class="btn btn-primary" type="submit">Send Reset Link</button></form>
<p class="note-box" id="nb" hidden>Check your inbox for the password reset email. If you do not receive it within 5 minutes, please inspect your spam folder.</p>
<p class="alt"><a href="login.html">Back to Sign In</a></p></section></main>
</div>
<script>document.getElementById('form').addEventListener('submit',function(e){e.preventDefault();document.getElementById('nb').hidden=false;});</script>
</body>
</html>
